<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<link rel="apple-touch-icon" id="touchIcon">
<style>
  :root{
    --bg:#FAFAF7; --surface:#FFFFFF;
    --ink:#1B2430; --ink-soft:#5B6572;
    --accent:#C1401F; --accent-ink:#FFFFFF;
    --ok:#2A4B7C; --alert:#C1401F;
    --rule:rgba(27,36,48,0.16); --rule-strong:rgba(27,36,48,0.32);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181C; --surface:#1B2126;
      --ink:#EDEDE8; --ink-soft:#9AA3AD;
      --accent:#E2704A; --accent-ink:#14181C;
      --ok:#7C9BC9; --alert:#E2704A;
      --rule:rgba(237,237,232,0.18); --rule-strong:rgba(237,237,232,0.34);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181C; --surface:#1B2126;
    --ink:#EDEDE8; --ink-soft:#9AA3AD;
    --accent:#E2704A; --accent-ink:#14181C;
    --ok:#7C9BC9; --alert:#E2704A;
    --rule:rgba(237,237,232,0.18); --rule-strong:rgba(237,237,232,0.34);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  * { box-sizing:border-box; }
  body{
    height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",-apple-system,"Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:"SF Mono","Courier New",monospace; font-variant-numeric:tabular-nums; }

  .app{ max-width:480px; margin:0 auto; padding:0 18px 40px; }

  header.ledger{
    position:sticky; top:0; z-index:5;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    background:var(--bg);
  }
  .ledger-title{ font-size:12px; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
  .ledger-amount{ font-size:38px; font-weight:700; letter-spacing:-0.01em; line-height:1.1; }
  .ledger-amount.alert{ color:var(--alert); }
  .ledger-amount.ok{ color:var(--ink); }
  .ledger-sub{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--rule);
    display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);
  }
  .ledger-sub span b{ color:var(--ink); font-weight:600; margin-left:4px; }
  .ledger-rule{ height:2px; background:var(--ink); margin-top:16px; }

  h2.section{
    font-size:12px; letter-spacing:.04em; color:var(--ink-soft);
    margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule);
  }

  .cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
  .cat-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:12px 2px; background:transparent; border:none;
    border-bottom:1px solid var(--rule); border-right:1px solid var(--rule);
    font-size:11px; color:var(--ink); min-height:66px; -webkit-tap-highlight-color:transparent;
  }
  .cat-btn:nth-child(4n){ border-right:none; }
  .cat-btn .em{ font-size:19px; filter:grayscale(45%); }
  .cat-btn.selected{ background:var(--accent); color:var(--accent-ink); }
  .cat-btn.selected .em{ filter:none; }

  .amount-block{ margin-top:22px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
  .amount-block label{ font-size:12px; color:var(--ink-soft); }
  .amount-row{ display:flex; align-items:baseline; gap:4px; margin-top:4px; }
  .amount-row .yen{ font-size:20px; color:var(--ink-soft); }
  .amount-input{
    flex:1; border:none; background:transparent; color:var(--ink);
    font-size:32px; font-weight:700; padding:0; -webkit-appearance:none;
  }
  .amount-input:focus{ outline:none; }

  details.memo{ margin-top:14px; }
  details.memo summary{ font-size:12px; color:var(--ink-soft); padding:4px 0; list-style:none; cursor:pointer; }
  details.memo summary::-webkit-details-marker{ display:none; }
  details.memo summary:before{ content:"＋ "; }
  details.memo[open] summary:before{ content:"－ "; }
  .memo-input{
    width:100%; margin-top:6px; padding:10px 0; border:none; border-bottom:1px solid var(--rule);
    background:transparent; color:var(--ink); font-size:14px;
  }
  .memo-input:focus{ outline:none; border-color:var(--ink); }

  .save-btn{
    width:100%; margin-top:22px; padding:16px; border:none;
    background:var(--ink); color:var(--bg); font-size:15px; font-weight:600;
    letter-spacing:.04em; -webkit-tap-highlight-color:transparent;
  }
  .save-btn:disabled{ opacity:0.3; }

  ul.recent{ list-style:none; padding:0; margin:0; }
  ul.recent li{
    display:flex; align-items:baseline; gap:8px; padding:11px 0;
    border-bottom:1px solid var(--rule); font-size:14px;
  }
  ul.recent li .em{ font-size:14px; filter:grayscale(45%); }
  ul.recent li .name{ white-space:nowrap; }
  ul.recent li .leader{
    flex:1; border-bottom:1px dotted var(--rule-strong); margin-bottom:3px; height:0;
  }
  ul.recent li .amt{ font-weight:600; }
  .empty{ font-size:13px; color:var(--ink-soft); padding:11px 0; }

  .toast{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg);
    padding:9px 16px; font-size:12px; letter-spacing:.03em; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="ledger">
    <div class="ledger-title">今月使える残額</div>
    <div class="ledger-amount num" id="residual">¥0</div>
    <div class="ledger-sub">
      <span>収入<b class="num" id="incomeTotal">¥0</b></span>
      <span>固定費<b class="num" id="fixedTotal">¥0</b></span>
      <span>支出<b class="num" id="spentTotal">¥0</b></span>
    </div>
    <div class="ledger-rule"></div>
  </header>

  <h2 class="section">カテゴリ</h2>
  <div class="cat-grid" id="catGrid"></div>

  <div class="amount-block">
    <label for="amountInput">金額</label>
    <div class="amount-row">
      <span class="yen">¥</span>
      <input id="amountInput" class="amount-input num" type="number" inputmode="numeric" placeholder="0" min="0">
    </div>
    <details class="memo">
      <summary>項目名を追加</summary>
      <input id="memoInput" class="memo-input" type="text" placeholder="項目名(任意)">
    </details>
  </div>

  <button class="save-btn" id="saveBtn" disabled>記録する</button>

  <h2 class="section">今日の記録</h2>
  <ul class="recent" id="recentList"></ul>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  (function makeIcon(){
    var c = document.createElement('canvas'); c.width=180; c.height=180;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#FAFAF7'; ctx.fillRect(0,0,180,180);
    ctx.strokeStyle = '#1B2430'; ctx.lineWidth = 6;
    ctx.strokeRect(14,14,152,152);
    ctx.fillStyle = '#C1401F';
    ctx.beginPath(); ctx.arc(90,90,52,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.font = '700 60px "Hiragino Kaku Gothic ProN",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('簿', 91, 94);
    document.getElementById('touchIcon').href = c.toDataURL('image/png');
  })();

  var DB_NAME='kakeibo', DB_VER=1, db;
  function openDB(){
    return new Promise(function(resolve,reject){
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function(e){
        var d = e.target.result;
        if(!d.objectStoreNames.contains('categories')) d.createObjectStore('categories',{keyPath:'id'});
        if(!d.objectStoreNames.contains('transactions')) d.createObjectStore('transactions',{keyPath:'id'});
        if(!d.objectStoreNames.contains('fixedCosts')) d.createObjectStore('fixedCosts',{keyPath:'id'});
        if(!d.objectStoreNames.contains('income')) d.createObjectStore('income',{keyPath:'id'});
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e); };
    });
  }
  function tx(storeName, mode){ return db.transaction(storeName, mode).objectStore(storeName); }
  function getAll(storeName){
    return new Promise(function(resolve,reject){
      var req = tx(storeName,'readonly').getAll();
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(e){reject(e);};
    });
  }
  function put(storeName, value){
    return new Promise(function(resolve,reject){
      var req = tx(storeName,'readwrite').put(value);
      req.onsuccess=function(){resolve();};
      req.onerror=function(e){reject(e);};
    });
  }
  function count(storeName){
    return new Promise(function(resolve,reject){
      var req = tx(storeName,'readonly').count();
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(e){reject(e);};
    });
  }

  var SEED_CATEGORIES = [
    {name:'食費(会社)', emoji:'🍚'},
    {name:'趣味', emoji:'🐧'},
    {name:'洋服', emoji:'👕'},
    {name:'交通費', emoji:'🚃'},
    {name:'食費', emoji:'🍚'},
    {name:'生活用品', emoji:'✂️'},
    {name:'にゃんこ', emoji:'🐾'},
    {name:'晴陽', emoji:'🐷'},
    {name:'病院', emoji:'🏥'},
    {name:'外食', emoji:'🍔'},
    {name:'必要', emoji:'⭐'}
  ];
  var SEED_FIXED = [
    {name:'楽天master(コストコ除く)', amount:46930-29566},
    {name:'車ローン', amount:10000},
    {name:'保育園', amount:4955},
    {name:'奨学金', amount:12445},
    {name:'水道代', amount:6136},
    {name:'住宅ローン①', amount:66423},
    {name:'住宅ローン②', amount:26350}
  ];
  var SEED_INCOME = [
    {name:'給料 手取り', amount:205000},
    {name:'香菜子', amount:80000}
  ];

  function seedIfEmpty(){
    return count('categories').then(function(n){
      if(n>0) return;
      var ops = [];
      SEED_CATEGORIES.forEach(function(c,i){ ops.push(put('categories',{id:'c'+i, name:c.name, emoji:c.emoji})); });
      SEED_FIXED.forEach(function(f,i){ ops.push(put('fixedCosts',{id:'f'+i, name:f.name, amount:f.amount})); });
      SEED_INCOME.forEach(function(inc,i){ ops.push(put('income',{id:'i'+i, name:inc.name, amount:inc.amount})); });
      return Promise.all(ops);
    });
  }

  var selectedCategoryId = null;
  var yen = function(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); };
  var todayKey = function(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
  var monthKey = function(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1); };
  function txMonthKey(dateStr){ var d=new Date(dateStr); return d.getFullYear()+'-'+(d.getMonth()+1); }

  function renderCategories(cats){
    var grid = document.getElementById('catGrid');
    grid.innerHTML='';
    cats.forEach(function(c){
      var btn = document.createElement('button');
      btn.className='cat-btn'+(c.id===selectedCategoryId?' selected':'');
      btn.innerHTML = '<span class="em">'+c.emoji+'</span><span>'+c.name+'</span>';
      btn.addEventListener('click', function(){
        selectedCategoryId = (selectedCategoryId===c.id) ? null : c.id;
        renderCategories(cats);
        updateSaveEnabled();
      });
      grid.appendChild(btn);
    });
  }

  function updateSaveEnabled(){
    var amt = parseInt(document.getElementById('amountInput').value,10);
    document.getElementById('saveBtn').disabled = !(selectedCategoryId && amt>0);
  }

  function refreshSummary(){
    return Promise.all([getAll('income'), getAll('fixedCosts'), getAll('transactions')]).then(function(res){
      var income=res[0], fixed=res[1], transactions=res[2];
      var incomeTotal = income.reduce(function(s,i){return s+i.amount;},0);
      var fixedTotal = fixed.reduce(function(s,f){return s+f.amount;},0);
      var mk = monthKey();
      var spentTotal = transactions.filter(function(t){return txMonthKey(t.date)===mk;})
                                    .reduce(function(s,t){return s+t.amount;},0);
      var residual = incomeTotal - fixedTotal - spentTotal;
      document.getElementById('incomeTotal').textContent = yen(incomeTotal);
      document.getElementById('fixedTotal').textContent = yen(fixedTotal);
      document.getElementById('spentTotal').textContent = yen(spentTotal);
      var el = document.getElementById('residual');
      el.textContent = yen(residual);
      el.className = 'ledger-amount num ' + (residual<0 ? 'alert':'ok');
    });
  }

  function refreshRecent(cats){
    return getAll('transactions').then(function(all){
      var tk = todayKey();
      var todays = all.filter(function(t){
        var d = new Date(t.date);
        return (d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())===tk;
      }).sort(function(a,b){ return b.date.localeCompare(a.date); });

      var list = document.getElementById('recentList');
      list.innerHTML='';
      if(todays.length===0){
        var li = document.createElement('li');
        li.className='empty'; li.textContent='まだ記録がありません';
        list.appendChild(li);
        return;
      }
      var catMap = {}; cats.forEach(function(c){ catMap[c.id]=c; });
      todays.forEach(function(t){
        var c = catMap[t.categoryId] || {emoji:'・', name:'(削除済み)'};
        var li = document.createElement('li');
        li.innerHTML = '<span class="em">'+c.emoji+'</span>'+
                        '<span class="name">'+(t.memo||c.name)+'</span>'+
                        '<span class="leader"></span>'+
                        '<span class="amt num">'+yen(t.amount)+'</span>';
        list.appendChild(li);
      });
    });
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1400);
  }

  document.getElementById('amountInput').addEventListener('input', updateSaveEnabled);

  document.getElementById('saveBtn').addEventListener('click', function(){
    var amt = parseInt(document.getElementById('amountInput').value,10);
    if(!selectedCategoryId || !(amt>0)) return;
    var memo = document.getElementById('memoInput').value.trim();
    var record = { id:'t'+Date.now(), date:new Date().toISOString(), categoryId:selectedCategoryId, amount:amt, memo:memo };
    put('transactions', record).then(function(){
      document.getElementById('amountInput').value='';
      document.getElementById('memoInput').value='';
      document.querySelector('details.memo').open=false;
      selectedCategoryId=null;
      return init(false);
    }).then(function(){ showToast('記録しました'); });
  });

  function init(seed){
    return (seed?seedIfEmpty():Promise.resolve()).then(function(){
      return getAll('categories');
    }).then(function(cats){
      renderCategories(cats);
      updateSaveEnabled();
      return Promise.all([refreshSummary(), refreshRecent(cats)]);
    });
  }

  openDB().then(function(_db){ db=_db; return init(true); })
    .catch(function(err){ console.error(err); showToast('読み込みに失敗しました'); });

})();
</script>
</body>
</html>
